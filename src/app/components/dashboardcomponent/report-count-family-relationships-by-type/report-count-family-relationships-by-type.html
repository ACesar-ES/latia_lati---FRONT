<div class="container">

  <h2>Relaciones familiares por parentesco</h2>
  <p class="subtitulo">Cuántas relaciones familiares hay registradas de cada tipo.</p>

  @if (cargado && lista.length === 0) {
    <p class="vacio">Todavía no hay datos para este reporte.</p>
  } @else {
    <p class="subtitulo"><strong>{{ total }}</strong> relaciones en total</p>
    <div class="grafico">
      <canvas
        baseChart
        [type]="chartType"
        [data]="chartData"
        [options]="chartOptions">
      </canvas>
    </div>
  }

</div>
